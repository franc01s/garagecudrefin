baseURL = "https://garagecudrefin.ch/"
locale = "fr-ch"
defaultContentLanguage = "fr"
title = "Garage Cudrefin"
theme = "garage"
summaryLength = 30
enableRobotsTXT = true

[pagination]
  pagerSize = 4

[params]
  logo = "images/logo.png"
  author = "Eduardo Martins"
  description = "Garage à Cudrefin : entretien préventif et mécanique générale, restauration automobile, préparation expertise, bus camping, voitures de remplacement, utilitaires légers, entreposage et installation de pneus."
  main_sections = ["post"]
  copyright = "Copyright eduardo@garagecudrefin.ch"

  # Marker already used by the previous OpenStreetMap embed.
  [params.map]
    latitude = 46.9605
    longitude = 7.0305
    bbox = "7.023,46.955,7.037,46.965"

[params.footer]
  enable = true
  contactInfoTitle = "Contact"

